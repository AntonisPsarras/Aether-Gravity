<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <!-- Void Navy as the OS chrome / PWA title bar colour -->
    <meta name="theme-color" content="#10141C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Aether Gravity</title>

    <style>
      /* ── Scrollbars: hidden globally (mirrors index.css rule) ── */
      * { scrollbar-width: none; -ms-overflow-style: none; }
      *::-webkit-scrollbar { display: none; width: 0; height: 0; }

      /* ── Base ── */
      body {
        background-color: #10141C;
        color: #F4F4FB;
      }

      /* ── Range inputs — nova-gold thumb ── */
      input[type="range"] { -webkit-appearance: none; background: transparent; cursor: pointer; }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #F9D423;
        margin-top: -8px;
        box-shadow: 0 0 8px rgba(249, 212, 35, 0.45);
        padding: 12px;
        box-sizing: content-box;
        background-clip: content-box;
      }
    </style>

    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
