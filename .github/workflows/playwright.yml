name: Playwright E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      # GitHub-hosted runners use software WebGL (~2–15 FPS). Keep smoke/sim regression strict;
      # perf soak only asserts the sim stays alive, not desktop-class frame rates.
      PERF_MIN_FPS: 1
      PERF_LOW_TIER_MIN_FPS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check for unused files, exports, and dependencies
        run: npm run lint:deadcode

      - name: Run unit tests
        run: npm run test

      - name: Build production assets
        run: npm run build

      - name: Production preview smoke test
        run: node scripts/production-smoke.mjs

      - name: Supply-chain audit gate
        run: node scripts/audit-gate.mjs

      - name: Android source manifest gate
        run: node scripts/android-manifest-gate.mjs

      - name: Secret pattern scan
        run: node scripts/secret-scan.mjs

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
